<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="avatarBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2546a8"/>
      <stop offset="60%" stop-color="#142668"/>
      <stop offset="100%" stop-color="#0a1236"/>
    </radialGradient>
    <linearGradient id="avatarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="avatarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#050b1f" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="120" cy="120" r="110" fill="url(#avatarBg)" stroke="url(#avatarBorder)" stroke-width="5" filter="url(#avatarShadow)"/>

  <!-- Inner Subtle Accent Ring -->
  <circle cx="120" cy="120" r="98" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Stylized Senior DevSecOps Monogram -->
  <text x="120" y="142" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="900" fill="url(#textGrad)" letter-spacing="3">
    SD
  </text>
  <text x="120" y="172" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" letter-spacing="3">
    DEVSECOPS
  </text>
</svg>
